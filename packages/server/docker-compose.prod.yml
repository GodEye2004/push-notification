version: "3.9"

services:
  server:
    build:
      context: .
    container_name: fcm-push-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://host.docker.internal:27017/fcm-push
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  admin-panel:
    build:
      context: ../admin-panel
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.100.63:3000
    container_name: fcm-push-admin-panel
    ports:
      - "3001:3000"
    environment:
      - SERVER_API_URL=http://server:3000
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge