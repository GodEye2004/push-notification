services:
  # 1. Backend Server
  - type: web
    name: fcm-push-server
    env: docker
    region: frankfurt
    plan: free
    dockerContext: packages/server
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        fromService:
          type: pserv
          name: fcm-push-mongo
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: KAVENEGAR_API_KEY
        sync: false

  # 2. Frontend Admin Panel
  - type: web
    name: fcm-push-admin
    env: docker
    region: frankfurt
    plan: free
    dockerContext: packages/admin-panel
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fcm-push-server
          property: url
      - key: SERVER_API_URL
        fromService:
          type: web
          name: fcm-push-server
          property: url

  # 3. MongoDB (Private Service with Disk)
  - type: pserv
    name: fcm-push-mongo
    env: docker
    region: frankfurt
    plan: starter # Private services are paid, need at least starter usually
    image: mongo:6.0
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: MONGO_INITDB_DATABASE
        value: push-notification
